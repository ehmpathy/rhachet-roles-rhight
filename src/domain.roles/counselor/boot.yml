      - briefs/market/comms/floor.howto.stand-up-a-dnc-suppression-program.[lesson].md

      # phone-contact law (TCPA) — ⭐ the counter-intuitive half: what defeats a careful program
      # .note = a ladder of three: FACTS -> LINES -> TODOS. they are SEPARATE on purpose. the
      #         catalogue holds facts and prescribes no action; the redlines hold imperatives and
      #         cite back by ID — so a redline with no landmine behind it reads as invented caution.
      # .note = ⚠️ the catalogue is fed by TWO sweeps of the same instrument — for what it DEMANDS
      #         and for what it GRANTS — and the grants half is group J. a hazard sweep returns
      #         hazards, so a reader who skips group J OVER-RESERVES against rules that never
      #         reached them, and no event ever corrects that: an unknown duty arrives as a demand
      #         letter, an unknown protection arrives never.
      # .note = ⭐ TWO WALKERS, and every entry is marked for which one steps on it. 🪨 type ⓪ =
      #         the PLAIN rule, which defeats a NIGHTWALKER (a reader with no model of this law).
      #         ⚡ type I/II = the SURPRISE, which defeats a LIGHTWALKER (a practitioner whose
      #         model is wrong or has a hole). ⛔ BOTH are enumerated — the obvious is NEVER
      #         omitted for obviousness — and only the surprises carry ⚡, so each reader finds
      #         their half at a glance. group K + redlines H18-H23 + mustcants ME26-ME30 are the
      #         🪨 plain set; all other rows are ⚡.
      # .note = ⛔ the plain rules were ABSENT until 2026-08-06, and the cause generalizes:
      #         rung ①'s admission test was "did a source CONTRADICT a competent reader's belief?"
      #         — which is READER-RELATIVE — and rung ② traces into ①, so ②'s reader-INDEPENDENT
      #         test was silently narrowed. a rule nobody was wrong about could not enter, however
      #         large. ⭐ A CATALOGUE'S BLIND SPOT IS PROPORTIONAL TO ITS AUTHORS' EXPERTISE.
      #         K7 records it. ⚠️ and type ⓪ cannot be swept for by anyone who has read the
      #         instrument — the only true instrument is an uninitiated reader.
      # .note = ⭐ a landmine here is not "a risk". it is a FALSE BELIEF THAT SURVIVES INSPECTION —
      #         what a competent person concludes from a correct read of a PARTIAL source. that is
      #         why they are catalogued apart from the law: the law is in the other briefs, and this
      #         pair maps where the law is counter-intuitive.
      # .note = ⭐ the redline test — "if you cross this line, are you defeated whatever else you
      #         do?" — is what keeps the file publishable. a preference among options the law PERMITS
      #         fails that test, so appetite is excluded by the rule of construction rather than by a
      #         scrub afterwards.
      # .note = ⚠️ a clean redline sheet proves you have not been DEFEATED. it never proves compliance
      #         — that needs the affirmative build in the floor.howto.* briefs above.
      # .note = ⭐ floor.mustcants is the TACTICAL read of the redlines — the TODOS. it buckets each
      #         line on two axes, MUST/CANT x ESTABLISH/ELIMINATE, and each cell carries a DIFFERENT
      #         shape of action: ME = build it and be able to PRODUCE it; MX = stop it, where a
      #         control layered on top is not a removal; CE = the window CLOSED, so done is
      #         unavailable; CX = a RESIDUAL that no control reaches, only bound and budget.
      #         ⭐ the two CANT cells are the payload — they name FALSE BELIEFS ABOUT ESCAPE, which
      #         is where the landmines cluster hardest and which no other file in the family holds.
      #         ⚠️ a reader with traffic ALREADY OUT reads the CANT column first: it names the
      #         repairs that no longer exist, before they spend on one.
      #         it stays publishable by the same rule of admission — a todo enters only where a line
      #         FORCES it, and every place the sources permit a choice is listed as an OPEN SILENCE.
      #         ⛔ build ORDER is itself a silence: a sequence is a spend decision, and a spend
      #         decision is appetite. CE is the only bucket with a clock, and that clock is in the
      #         SOURCE rather than in our preference.
      # .note = ⭐ group J of floor.landmines is the GRANTS sweep: what the sources GIVE you rather
      #         than what defeats you — the ported-number grace, the (a)(3) numerical limits, the
      #         (a)(2) nonprofit/HIPAA drop, the personal-relationship exception, the (c)(2)(ii)
      #         signed written agreement. ⛔ J6 is the correction that group exists to carry: NO
      #         PROTECTION IS FREE. an earlier cut held these in a separate file (floor.armory) and
      #         split them into "armor" (passive, unloseable) and "shields" (pleaded and proved) —
      #         the armor half was FALSE on its own entries, since every protection carries
      #         conditions YOU must establish. R17-R19 and ME22-ME25 carry that correction forward.
      - briefs/market/comms/floor.landmines.[lesson].md
      - briefs/market/comms/floor.redlines.[lesson].md
      - briefs/market/comms/floor.mustcants.[lesson].md


      # ⭐ research method — run this at the END of every research pass, any subject
      # .note = a synthesis brief is organized by what the sources REQUIRE, so it structurally loses
      #         where a reader's intuition DIVERGES from them. that divergence exists only as a
      #         relation between source and reader — invisible in the source, so a faithful summary
      #         cannot carry it. it is also the most perishable result of the pass.
      # .note = ⭐ two kinds of landmine, and most hazard lists capture only the first: type I = the
      #         belief is WRONG (discoverable only by contradiction); type II = the belief is ABSENT
      #         (discoverable by an exhaustive read, and the larger + cheaper half).
      # .note = ⭐ the redline test — "if you cross it, are you defeated whatever else you do?" —
      #         excludes appetite BY CONSTRUCTION, which is what keeps the output publishable.
      # .note = symlinked to .agent/repo=.this/role=any/briefs/ so every role in this repo sees it
      # .note = ⭐ THE LADDER: facts -> lines -> todos, each rung a LOSSY projection of the one below.
      #         (1) floor.landmines = what defeats a careful reader. (2) floor.redlines = cross it and
      #         you are defeated whatever else you do. (3) floor.mustcants = the todo and its
      #         done-condition. ⛔ each rung DROPS information on purpose — (1)->(2) drops every
      #         non-fatal fact, which excludes APPETITE by construction; (2)->(3) drops the ORDER,
      #         which keeps the artifact from turning into a plan. ⛔ you cannot skip a rung: sources
      #         -> todos IS a plan, with judgment you never justified and no trace column to check.
      # .note = ⭐ the trace chain must be complete UPWARD (todo -> line -> fact -> source) and is
      #         EXPECTED to be incomplete downward. a break upward is a named defect: a line with no
      #         fact = invented caution; a todo with no line = invented work.
      # .note = ⭐ CAN'T means CANNOT, never MAY NOT. under the forbidden sense the mustcants matrix
      #         degenerates — CE duplicates MX and CX is meaningless. every "you may not" lands in MX.
      # .note = ⭐ a sweep LOWERS the measured floor while it RAISES the real one: hidden lines become
      #         visible, so the count worsens as the position improves. ⛔ any process that rewards the
      #         count will kill the sweep. a SHORT line list means a SHORT SWEEP, never a high floor.
      - briefs/research/howto.distill-redlines-and-landmines.[lesson].md
      - briefs/research/define.the-floor-ladder.[lesson].md
      - briefs/research/define.the-mustcants-matrix.[lesson].md

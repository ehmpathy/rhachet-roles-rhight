      #        loss — California's $800 minimum, New York's fixed dollar
      #        minimum — which is the fact a loss-year filer most misses.
      - briefs/franchise-tax/state=texas/howto.file.state=texas.current.active-loss.md
      - briefs/franchise-tax/state=texas/howto.file.state=texas.delinquent.active-loss.md

org: ehmpathy
extends:
  - .agent/repo=bhrain/role=reviewer/keyrack.yml
  - .agent/repo=bhuild/role=dispatcher/keyrack.yml
  - .agent/repo=ehmpathy/role=mechanic/keyrack.yml
  - .agent/repo=rhight/role=patenter/keyrack.yml
env.all: null
env.prod:
  - USPTO_ODP_API_KEY
env.prep:
  - EHMPATHY_SEATURTLE_PROD_GITHUB_TOKEN
  # the pre-commit PII gate's second layer. `pii.scan --via brain` calls
  # `rhx review --brain anthropic/claude/opus`, an API brain — so this is
  # the credential a commit blocks on when it is absent
  - ANTHROPIC_API_KEY
env.test:
  - USPTO_ODP_API_KEY
  - GOOGLE_CLOUD_RHIGHT_SERVICE_ACCOUNT_CREDS
  - ANTHROPIC_API_KEY

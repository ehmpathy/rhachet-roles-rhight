why:
  ask: 'thats not possible; we want the coverage to be really big and must plan for that. whats a (?) at the cost of ?'
  purpose: 'the vision priced NOHARM on a STATISTICAL guarantee: public unknown is safe while the class stays large, which decays as coverage rises. the wisher rejected the premise outright: high coverage is the plan, so a guarantee that decays with coverage is the wrong shape of guarantee. the fix is a POLICY guarantee (a disclosed blanket rule, the glomar shape) plus a per-row split, since presence-facts and absence-facts move in opposite directions as coverage grows.'
  benefit: 'the design survives full coverage instead of degrading into it; the awkwardness i promoted to load-bearing is retracted to a bounded per-row concern; the cost of the questionmark is priced honestly as the forfeited ability to say clean.'
